version: "2"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - revive
    - misspell
formatters:
  enable:
    - goimports
linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
  revive:
    rules:
      - name: comment-spacings
        disabled: false
issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
